<section class="hero" aria-labelledby="hero-heading">
  <!-- Glowing background blobs -->
  <div class="hero-blob hero-blob--1"></div>
  <div class="hero-blob hero-blob--2"></div>

  <div class="hero-content">
    <!-- Beautiful Mascot SVG -->
    <div class="hero-mascot">
      <svg width="120" height="120" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="logo-svg">
        <!-- Wheels -->
        <circle cx="35" cy="85" r="8" fill="#166fe5" />
        <circle cx="75" cy="85" r="8" fill="#166fe5" />
        <circle cx="35" cy="85" r="4" fill="#ffffff" />
        <circle cx="75" cy="85" r="4" fill="#ffffff" />
        <!-- Cart Legs/Stands -->
        <path d="M30 65L35 77M70 65L75 77" stroke="#166fe5" stroke-width="4" stroke-linecap="round"/>
        <!-- Cart Basket Outline -->
        <rect x="20" y="25" width="60" height="40" rx="10" fill="#e1eeff" stroke="#166fe5" stroke-width="4"/>
        <!-- Handle -->
        <path d="M15 32H20M15 32L10 20M10 20H2" stroke="#166fe5" stroke-width="4" stroke-linecap="round"/>
        <!-- Glasses -->
        <circle cx="40" cy="42" r="10" stroke="#166fe5" stroke-width="4" fill="#ffffff"/>
        <circle cx="60" cy="42" r="10" stroke="#166fe5" stroke-width="4" fill="#ffffff"/>
        <path d="M50 42H52" stroke="#166fe5" stroke-width="4"/>
        <!-- Happy Eyes (arcs) -->
        <path d="M37 42C37 40 43 40 43 42" stroke="#166fe5" stroke-width="2" stroke-linecap="round"/>
        <path d="M57 42C57 40 63 40 63 42" stroke="#166fe5" stroke-width="2" stroke-linecap="round"/>
        <!-- Smile -->
        <path d="M44 54C44 58 56 58 56 54" stroke="#166fe5" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>

    <h1 id="hero-heading" class="tagline">Click.Cart. Delivered.</h1>
    <p class="description">
      AI-powered grocery shopping for busy professionals in Olongapo City.
      Smart recommendations, real-time cart tracking, and effortless delivery.
    </p>
    <div class="cta-buttons">
      <a mat-flat-button routerLink="/login" class="cta-primary">Log In</a>
      <a mat-stroked-button routerLink="/register" class="cta-secondary">Register</a>
    </div>
  </div>
</section>
